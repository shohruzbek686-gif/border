<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;

        }
        img{
            width: 150px;
            height: 150px;
            border-radius: 50%;
            text-align: center;
            border: 2px solid blue;
        }
        body {
            background-color: rgb(200, 204, 208);
        }
        .katta {
            width: 20%;
            background-color: white;
            border: 2px solid black;
            border-radius: 15px;
            padding: 28px;
            margin: 0 auto;
            height: 25%;
            text-align: center;
            margin-top: 80px;
        }
        .Frontend {
            color: gray;
            text-align: center;
        }
        .but {
            background-color: lightblue;
            display: inline;
            border: 1px solid black;
            border-radius: 19px;
            padding: 3px;
            margin: 8px;
        }
        .card-footer{
            display: flex;
            margin: 20px 0;
            justify-content: center;
            align-items: center;
            gap: 40px;
        }
        .follow {
            background-color: blue;
            color: white;
            width: 80px;
            border-radius: 8px;
            
        }
        .message {
            background-color: white;
            color: blue;
            width: 80px;
            border-radius: 8px;
            border: 1px solid blue;
        }
    </style>
</head>
<body>
    <div class="katta">
        <img src="wattblicker-avatar-7964945_1920.png" alt="">
        <h2>Student</h2>
        <p class="Frontend">Frontend Learner</p>
        <p>I am learning HTML and CSS. I understand box model,borders,margins and text styling </p>
        <h3>Skills</h3>
        <div class="but"> HTML</div> <div class="but">CSS</div>  <div class="but">Box Model</div>
        <div class="card-footer">
        <div class="follow">Follow</div>
        <div class="message">Message</div>
        </div>
    </div>
</body>
</html>
